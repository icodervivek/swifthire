version: "3.9"

services:
  backend:
    build: ./server
    container_name: swifthire_backend
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build: ./client
    container_name: swifthire_frontend
    ports:
      - "5173:80"
    env_file:
      - ./client/.env
    depends_on:
      - backend
    restart: unless-stopped
